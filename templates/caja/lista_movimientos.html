  {% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Movimientos de Caja</h2>
    <ul>
        {% for mov in movimientos %}
            <li id="movimiento-{{ mov.id }}">
                {{ mov.tipo }} - {{ mov.descripcion }} - {{ mov.monto }}
                <a href="{% url 'caja:eliminar_movimiento' mov.id %}" 
                   class="btn btn-danger btn-sm btn-eliminar">
                   Eliminar
                </a>
            </li>
        {% empty %}
            <li>No hay movimientos registrados.</li>
        {% endfor %}
    </ul>
</div>

<!-- Cargar el script de eliminación -->
<script src="{% static 'js/eliminar_movimiento.js' %}"></script>
{% endblock %}
