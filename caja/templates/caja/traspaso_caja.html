{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow border-info">
                <div class="card-header bg-info text-white">
                    <h4 class="mb-0">
                        <i class="fas fa-exchange-alt me-2"></i>
                        Traspaso entre QR y Efectivo
                    </h4>
                </div>
                <div class="card-body">
                    <div class="alert alert-light border">
                        <strong>Caja:</strong> #{{ caja.id }}
                        <span class="mx-2">|</span>
                        <strong>Movimiento:</strong> {{ origen }} → {{ destino }}
                    </div>

                    <form method="post">
                        {% csrf_token %}
                        <input type="hidden" name="origen" value="{{ origen }}">
                        <input type="hidden" name="destino" value="{{ destino }}">

                        <div class="mb-3">
                            <label for="monto" class="form-label">Monto</label>
                            <input type="number" name="monto" id="monto" class="form-control" min="0.01" step="0.01" required value="0.00">
                        </div>

                        <div class="mb-3">
                            <label for="descripcion" class="form-label">Descripción</label>
                            <input type="text" name="descripcion" id="descripcion" class="form-control" value="Traspaso {{ origen }} a {{ destino }}" required>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{% url 'caja:dashboard' %}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left me-2"></i>Cancelar
                            </a>
                            <button type="submit" class="btn btn-info text-white">
                                <i class="fas fa-save me-2"></i>Registrar traspaso
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
